<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAMBONO — حامبونو</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👁</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=IM+Fell+English+SC&family=Tajawal:wght@400;700&display=swap">
<style>
:root{--void:#040405;--ash:#14161a;--bone:#d8cebf;--dim:#8d877d;--blood:#9b2218;--steel:#3d6075}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--void);color:var(--bone);font:400 1.05rem/1.9 Tajawal,sans-serif;overflow-x:hidden}
h1,h2{font-family:'Aref Ruqaa',serif;font-weight:700;line-height:1.15}
html[lang=en] h1,html[lang=en] h2{font-family:'IM Fell English SC',serif;font-weight:400;letter-spacing:.04em}
a{color:inherit}
:focus-visible{outline:2px solid var(--blood);outline-offset:3px}
.grain{position:fixed;inset:-50%;z-index:50;pointer-events:none;opacity:.14;animation:grain 1s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-4%)}60%{transform:translate(-2%,3%)}80%{transform:translate(4%,1%)}}
nav{position:absolute;inset:0 0 auto;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:1.2rem clamp(1rem,5vw,4rem)}
nav b{font:1.3rem 'IM Fell English SC',serif;letter-spacing:.2em}
#lang{background:none;border:1px solid #fff3;color:var(--bone);padding:.3rem 1rem;font:inherit;cursor:pointer}
#lang:hover{border-color:var(--blood)}
.hero{position:relative;min-height:100svh;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:2rem;padding:6rem clamp(1rem,5vw,4rem) 3rem;overflow:hidden}
.face{position:relative;justify-self:center;width:min(100%,640px);aspect-ratio:1;-webkit-mask-image:radial-gradient(circle,#000 45%,transparent 72%);mask-image:radial-gradient(circle,#000 45%,transparent 72%)}
.face img{width:100%;height:100%;object-fit:cover;display:block}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle 230px at var(--x,30%) var(--y,55%),transparent 0,rgba(4,4,5,.55) 55%,rgba(4,4,5,.97) 100%);animation:flick 7s infinite}
.hero>*{z-index:2}
@keyframes flick{0%,41%,45%,100%{opacity:1}42%{opacity:.35}43%{opacity:1}44%{opacity:.15}}
h1{font-size:clamp(3.6rem,10vw,8rem);position:relative}
h1::before,h1::after{content:attr(data-t);position:absolute;inset:0;opacity:0}
h1::before{color:var(--blood)}h1::after{color:var(--steel)}
h1.g::before{opacity:.8;transform:translate(-5px,2px);clip-path:inset(20% 0 55% 0)}
h1.g::after{opacity:.8;transform:translate(5px,-2px);clip-path:inset(60% 0 8% 0)}
.tag{font-size:1.35rem;color:var(--dim);margin:.6rem 0 2rem;max-width:30ch}
.dl{display:flex;flex-wrap:wrap;gap:1rem}
.btn{display:block;min-width:230px;padding:.9rem 1.4rem;background:var(--ash);border:1px solid #fff2;border-inline-start:4px solid var(--blood);text-decoration:none;transition:background .3s,border-color .3s}
.btn:hover{background:#2a1210;border-color:var(--blood)}
.btn.pri{background:#2a1210}
.btn b{display:block;font-size:1.15rem}.btn small{color:var(--dim)}
.btn.off{pointer-events:none;opacity:.4;border-inline-start-color:var(--steel)}
.warn{margin-top:1.4rem;color:var(--dim);font-size:.9rem;max-width:46ch}
section.how{padding:5rem clamp(1rem,5vw,4rem);max-width:1100px;margin:auto}
h2{font-size:clamp(2rem,5vw,3rem);margin-bottom:2rem}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:3rem}
.cols h3{font-size:1.3rem;border-bottom:1px solid var(--blood);padding-bottom:.4rem;margin-bottom:1rem}
ol{padding-inline-start:1.3rem;color:#bdb4a6}li{margin-bottom:.5rem}li::marker{color:var(--blood)}
.req{margin-top:1rem;color:var(--dim);font-size:.95rem}
footer{padding:3rem 1rem;text-align:center;color:var(--dim);border-top:1px solid #fff1;font-size:.9rem}
@media(max-width:820px){.hero{grid-template-columns:1fr;padding-top:5rem}.face{order:-1;width:min(90%,420px)}}
@media(prefers-reduced-motion:reduce){.grain,.hero::after{animation:none}}
</style>
</head>
<body>
<canvas class="grain" id="grain"></canvas>
<header class="hero" id="hero">
  <nav><b>HAMBONO</b><button id="lang" aria-label="Language">English</button></nav>
  <div>
    <h1 id="title" data-t="حامبونو">حامبونو</h1>
    <p class="tag" data-i="tag"></p>
    <div class="dl">
      <a class="btn" id="b-windows" href="/download/windows"><b data-i="win"></b><small id="m-windows"></small></a>
      <a class="btn" id="b-android" href="/download/android"><b data-i="and"></b><small id="m-android"></small></a>
    </div>
    <p class="warn" data-i="warn"></p>
  </div>
  <div class="face"><img src="hambono.png" alt="HAMBONO"></div>
</header>
<section class="how">
  <h2 data-i="how"></h2>
  <div class="cols">
    <div><h3>Windows</h3><ol data-i="wsteps"></ol><p class="req" data-i="wreq"></p></div>
    <div><h3>Android</h3><ol data-i="asteps"></ol><p class="req" data-i="areq"></p></div>
  </div>
</section>
<footer>© 2026 HAMBONO</footer>
<script>
const T={
ar:{tag:'هو يسمعك وأنت تتنفس. لا تُشعل الضوء.',win:'حمّل لنسخة ويندوز',and:'حمّل لنسخة أندرويد',
warn:'قد يعرض نظامك تحذيرًا لأن اللعبة غير موقّعة رقميًا. هذا طبيعي، والملفات تأتي من هذا الموقع فقط.',
how:'قبل أن تدخل',
wsteps:['فك ضغط الملف HAMBONO_WINDOWS.zip.','افتح المجلد وشغّل HAMBONO.exe.','أطفئ الأضواء وضع السماعات.'],
asteps:['نزّل ملف HAMBONO.apk.','فعّل «التثبيت من مصادر غير معروفة» عند الطلب.','افتح الملف ثم اضغط تثبيت.'],
wreq:'يتطلب ويندوز 10 أو 11 (64 بت) مع دعم DirectX 12.',areq:'يتطلب هاتف أندرويد بمعالج 64 بت (arm64-v8a).',soon:'قريبًا',other:'English'},
en:{tag:'He hears you breathing. Do not turn on the light.',win:'Download for Windows',and:'Download for Android',
warn:'Your system may warn you because the game is not digitally signed. This is expected; files only come from this site.',
how:'Before you enter',
wsteps:['Extract HAMBONO_WINDOWS.zip.','Open the folder and run HAMBONO.exe.','Turn off the lights and put on headphones.'],
asteps:['Download HAMBONO.apk.','Allow "Install from unknown sources" when asked.','Open the file and tap Install.'],
wreq:'Requires Windows 10 or 11 (64-bit) with DirectX 12 support.',areq:'Requires an Android phone with a 64-bit processor (arm64-v8a).',soon:'Coming soon',other:'العربية'}};
let L=localStorage.getItem('hl')||'ar',P={};
const $=s=>document.querySelector(s);
function render(){
  document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';
  const t=T[L];
  document.querySelectorAll('[data-i]').forEach(e=>{const v=t[e.dataset.i];
    if(Array.isArray(v))e.innerHTML=v.map(x=>`<li>${x}</li>`).join('');else e.textContent=v});
  const h=$('#title');h.textContent=h.dataset.t=L==='ar'?'حامبونو':'HAMBONO';
  $('#lang').textContent=t.other;
  for(const k of['windows','android']){const p=P[k],b=$('#b-'+k);if(!p)continue;
    b.href=`/download/${k}?l=${L}`;b.classList.toggle('off',!p.enabled);
    $('#m-'+k).textContent=p.enabled?`v${p.version} · ${(p.size/1048576).toFixed(0)} MB`:t.soon}
}
$('#lang').onclick=()=>{L=L==='ar'?'en':'ar';localStorage.setItem('hl',L);render()};
fetch('/api/platforms').then(r=>r.json()).then(d=>{P=d;render();
  if(/android/i.test(navigator.userAgent))$('#b-android').classList.add('pri');else $('#b-windows').classList.add('pri')}).catch(render);
fetch('/api/visit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lang:L})}).catch(()=>{});
render();
// flashlight
const hero=$('#hero'),reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;let manual=false;
const move=(x,y)=>{manual=true;const r=hero.getBoundingClientRect();hero.style.setProperty('--x',x-r.left+'px');hero.style.setProperty('--y',y-r.top+'px')};
hero.addEventListener('pointermove',e=>move(e.clientX,e.clientY));
hero.addEventListener('touchmove',e=>move(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
if(!reduce)setInterval(()=>{if(!manual){const f=$('.face').getBoundingClientRect(),r=hero.getBoundingClientRect(),t=Date.now()/1500;
  hero.style.setProperty('--x',f.left-r.left+f.width/2+Math.sin(t)*90+'px');hero.style.setProperty('--y',f.top-r.top+f.height*.45+Math.cos(t*1.3)*60+'px')}},50);
// glitch
if(!reduce)setInterval(()=>{if(Math.random()<.35){const h=$('#title');h.classList.add('g');setTimeout(()=>h.classList.remove('g'),120+Math.random()*200)}},2500);
// grain
{const c=$('#grain'),x=c.getContext('2d');c.width=c.height=256;const d=x.createImageData(256,256);
 for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}
 x.putImageData(d,0,0);c.style.width=c.style.height='200%';c.style.imageRendering='pixelated'}
</script>
</body>
</html>
